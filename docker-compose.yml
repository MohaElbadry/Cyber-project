# =============================================================================
# Docker Compose - Zabbix Monitoring Stack
# Projet: Infrastructure Cloud de Supervision Centralisée sous AWS
# Auteur: EL BADRY Mohammed
# =============================================================================

version: "3.8"

services:
  # ==========================================================================
  # Base de données MySQL 8.0
  # ==========================================================================
  mysql-server:
    image: mysql:8.0
    container_name: zabbix-mysql
    restart: always
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_pwd_secure
      MYSQL_ROOT_PASSWORD: root_pwd_secure
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Serveur Zabbix 7.0 LTS
  # ==========================================================================
  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    container_name: zabbix-server
    restart: always
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_pwd_secure
      MYSQL_ROOT_PASSWORD: root_pwd_secure
      ZBX_CACHESIZE: 128M
    ports:
      - "10051:10051"
    depends_on:
      mysql-server:
        condition: service_healthy
    networks:
      - zabbix-net
    volumes:
      - zabbix_server_data:/var/lib/zabbix

  # ==========================================================================
  # Interface Web Zabbix (Nginx)
  # ==========================================================================
  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zabbix-web
    restart: always
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_pwd_secure
      PHP_TZ: Europe/Paris
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      - zabbix-server
    networks:
      - zabbix-net

  # ==========================================================================
  # Agent Zabbix (pour monitorer le serveur lui-même)
  # ==========================================================================
  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: zabbix-agent
    restart: always
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: "Zabbix-Server"
    privileged: true
    depends_on:
      - zabbix-server
    networks:
      - zabbix-net

# =============================================================================
# Volumes persistants
# =============================================================================
volumes:
  mysql_data:
    name: zabbix_mysql_data
  zabbix_server_data:
    name: zabbix_server_data

# =============================================================================
# Réseau Docker
# =============================================================================
networks:
  zabbix-net:
    name: zabbix-network
    driver: bridge
# =============================================================================
# INSTRUCTIONS D'UTILISATION:
#
# 1. Créer le répertoire et copier ce fichier:
#    mkdir -p ~/zabbix && cd ~/zabbix
#    nano docker-compose.yml
#
# 2. Lancer les conteneurs:
#    docker compose up -d
#
# 3. Vérifier le statut:
#    docker compose ps
#
# 4. Voir les logs:
#    docker compose logs -f
#
# 5. Accéder à l'interface web:
#    http://<IP-PUBLIQUE>
#    Username: Admin
#    Password: zabbix
#
# 6. Arrêter les conteneurs:
#    docker compose down
#
# 7. Supprimer les données (ATTENTION):
#    docker compose down -v
# =============================================================================
