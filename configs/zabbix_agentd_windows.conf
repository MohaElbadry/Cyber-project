# Configuration Agent Zabbix - Client Windows
# Fichier: C:\Program Files\Zabbix Agent\zabbix_agentd.conf
# ==============================================================================

# Mode passif - Le serveur Zabbix interroge l'agent
# Remplacez par l'IP PRIVÉE de votre serveur Zabbix (ex: 10.0.1.45)
Server=10.0.1.X

# Mode actif - L'agent envoie les données au serveur
# Remplacez par l'IP PRIVÉE de votre serveur Zabbix
ServerActive=10.0.1.X

# Nom de l'hôte - DOIT correspondre EXACTEMENT au nom dans l'interface Zabbix
# Remplacez "VotreNom" par votre nom
Hostname=Client-Windows-VotreNom

# Port d'écoute de l'agent (par défaut: 10050)
ListenPort=10050

# Fichier de log
LogFile=C:\Program Files\Zabbix Agent\zabbix_agentd.log

# Niveau de log
DebugLevel=3

# Timeout
Timeout=30

# ==============================================================================
# INSTRUCTIONS D'INSTALLATION (Windows):
#
# MÉTHODE 1 - Installation MSI (Recommandée):
# 1. Téléchargez l'agent depuis: https://www.zabbix.com/download_agents
#    - Version: 7.0 LTS
#    - OS: Windows
#    - Architecture: amd64
#    - Encryption: OpenSSL
#    - Package: MSI
#
# 2. Double-cliquez sur le fichier .msi
#
# 3. Pendant l'installation, configurez:
#    - Host name: Client-Windows-VotreNom
#    - Zabbix server IP: 10.0.1.X (IP PRIVÉE)
#    - Agent listen port: 10050
#    - Server for active checks: 10.0.1.X
#
# 4. Terminez l'installation
#
# 5. Vérifiez le service:
#    - Ouvrez services.msc
#    - Cherchez "Zabbix Agent"
#    - Vérifiez qu'il est "Running"
#
# MÉTHODE 2 - Modification manuelle:
# 1. Ouvrez le fichier de config avec un éditeur en mode Administrateur:
#    C:\Program Files\Zabbix Agent\zabbix_agentd.conf
#
# 2. Modifiez Server, ServerActive et Hostname
#
# 3. Redémarrez le service:
#    - services.msc > Zabbix Agent > Restart
#    - Ou PowerShell: Restart-Service "Zabbix Agent"
# ==============================================================================
