# Configuration Agent Zabbix - Client Linux
# Fichier: /etc/zabbix/zabbix_agentd.conf
# ==============================================================================

# Mode passif - Le serveur Zabbix interroge l'agent
# Remplacez par l'IP PRIVÉE de votre serveur Zabbix (ex: 10.0.1.45)
Server=10.0.1.X

# Mode actif - L'agent envoie les données au serveur
# Remplacez par l'IP PRIVÉE de votre serveur Zabbix
ServerActive=10.0.1.X

# Nom de l'hôte - DOIT correspondre EXACTEMENT au nom dans l'interface Zabbix
# Remplacez "VotreNom" par votre nom
Hostname=Client-Linux-VotreNom

# Port d'écoute de l'agent (par défaut: 10050)
ListenPort=10050

# Fichier de log
LogFile=/var/log/zabbix/zabbix_agentd.log

# Niveau de log (0=aucun, 1=critique, 2=erreur, 3=warning, 4=debug, 5=extended debug)
DebugLevel=3

# Timeout pour les opérations
Timeout=30

# ==============================================================================
# INSTRUCTIONS D'INSTALLATION:
# 
# 1. Sauvegarder la config originale:
#    sudo cp /etc/zabbix/zabbix_agentd.conf /etc/zabbix/zabbix_agentd.conf.backup
#
# 2. Modifier les valeurs ci-dessus dans le fichier original
#
# 3. Redémarrer l'agent:
#    sudo systemctl restart zabbix-agent
#    sudo systemctl enable zabbix-agent
#
# 4. Vérifier le statut:
#    sudo systemctl status zabbix-agent
#
# 5. Vérifier les logs si problème:
#    sudo tail -f /var/log/zabbix/zabbix_agentd.log
# ==============================================================================
